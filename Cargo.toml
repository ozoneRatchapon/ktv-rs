[package]
name = "app"
version = "0.37.0"
authors = ["ozoneRatchapon <ratchapon.poc@gmail.com>"]
edition = "2021"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AbortSignal",
    "AudioContext",
    "AudioNode",
    "AudioWorklet",
    "OscillatorNode",
    "GainNode",
    "AudioScheduledSourceNode",
    "AudioDestinationNode",
    "AudioParam",
    "AudioWorkletNode",
    "AudioWorkletNodeOptions",
    "BaseAudioContext",
    "Blob",
    "BlobPropertyBag",
    "ChannelInterpretation",
    "ChannelCountMode",
    "CloseEvent",
    "Crypto",
    "Clipboard",
    "Document",
    "DomException",
    "Element",
    "Event",
    "EventTarget",
    "Headers",
    "MediaDevices",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MessageEvent",
    "MessagePort",
    "Navigator",
    "Location",
    "RequestInit",
    "Response",
    "SpeechSynthesis",
    "SpeechSynthesisUtterance",
    "SpeechSynthesisVoice",
    "Storage",
    "Url",
    "WebSocket",
    "Window",
    "Worklet",
] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.release]
# std ships with DWARF; binaryen's wasm-opt aborts on it (DWARFEmitter UNREACHABLE) and dx then
# silently ships the unoptimised wasm. Stripping it lets wasm-opt run.
strip = "debuginfo"
# Whole-program optimisation: -14% wasm (-16% gzip) at the same speed. opt-level "s"/"z" gave no further
# size win after dx's wasm-opt and made pitch detection 2.2x slower (bench/002_release_profile.md).
lto = true
codegen-units = 1

[[bench]]
name = "pitch_detector"
harness = false
