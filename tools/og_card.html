<!DOCTYPE html>
<!-- Link-preview card (LINE, Facebook, X, Discord): renders public/og-image.png at 1200x630. Regenerate:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,630 --screenshot=public/og-image.png "file://$PWD/tools/og_card.html" -->
<html lang="th">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Kanit; font-weight: 400; src: url(../public/fonts/kanit-400-thai.woff2) format('woff2'); unicode-range: U+0E01-0E5B; }
  @font-face { font-family: Kanit; font-weight: 400; src: url(../public/fonts/kanit-400-latin.woff2) format('woff2'); }
  @font-face { font-family: Kanit; font-weight: 700; src: url(../public/fonts/kanit-700-thai.woff2) format('woff2'); unicode-range: U+0E01-0E5B; }

  body { width: 1200px; height: 630px; overflow: hidden; background: radial-gradient(circle at 80% 20%, #16324a 0, #0b0d13 60%); color: #f1f5f9; font-family: Kanit, sans-serif; display: flex; align-items: center; padding: 0 72px; gap: 56px; }
  img { width: 280px; height: 280px; border-radius: 64px; box-shadow: 0 20px 60px rgba(0, 245, 212, 0.25); flex-shrink: 0; }
  h1 { font-size: 104px; font-weight: 700; line-height: 1; letter-spacing: -2px; }
  h1 span { color: #38bdf8; }
  .th { font-size: 54px; font-weight: 700; margin-top: 18px; line-height: 1.3; }
  .sub { font-size: 27px; color: #94a3b8; margin-top: 18px; line-height: 1.4; }
  .pill { display: inline-block; margin-top: 26px; padding: 8px 22px; border-radius: 999px; background: #f59e0b; color: #0b0d13; font-size: 28px; font-weight: 700; }
</style>
</head>
<body>
  <img src="../public/icons/icon-512.png" alt="" />
  <div>
    <h1>KTV<span>-RS</span></h1>

  </div>
</body>
</html>
