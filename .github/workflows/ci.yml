name: CI

on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: 0.7.10

jobs:
  rust:
    name: Rust tests + clippy (native, wasm)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features web -- -D warnings

  js:
    name: Sync core tests + lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Pass the file, not the directory: Node 24 treats a directory argument as a module to run
      - run: node --test tests/ktv_sync.test.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint assets/ktv_sync.js assets/mic_worklet.js tests/ktv_sync.test.cjs
      - run: python3 -m py_compile tools/link_check.py

  build:
    name: Web release build
    needs: [rust, js]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --locked dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      # Same script as deploy.sh: fails on a degraded bundle, stages dist/ with Cloudflare _headers
      - run: tools/build_web.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ktv-rs-web
          path: dist
          retention-days: 7
