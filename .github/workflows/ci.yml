name: CI

on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: 0.7.10

jobs:
  rust:
    name: Rust tests + clippy (native, wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features web -- -D warnings

  js:
    name: Sync core tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Pass the file, not the directory: Node 24 treats a directory argument as a module to run
      - run: node --test tests/ktv_sync.test.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint assets/ktv_sync.js assets/mic_worklet.js tests/ktv_sync.test.cjs
      - run: python3 -m py_compile tools/guide_align.py tools/link_check.py

  build:
    name: Web release build
    needs: [rust, js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --locked dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      # dx exits 0 even when wasm-opt or esbuild fail: it ships an unoptimised wasm, or JS whose
      # `./snippets/` imports 404 (blank page). Treat any logged ERROR or a leftover snippet import as a failure.
      - name: dx build --release (fail on degraded bundle)
        shell: bash
        run: |
          dx build --release --platform web 2>&1 | tee dx-build.log
          if grep -q "ERROR" dx-build.log; then echo "::error::dx logged an ERROR (see above)"; exit 1; fi
          if grep -l "snippets/" target/dx/app/release/web/public/assets/*.js; then echo "::error::unbundled wasm-bindgen snippet import"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ktv-rs-web
          path: target/dx/app/release/web/public
          retention-days: 7
