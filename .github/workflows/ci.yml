name: CI

on:
  push:
    branches: [main, develop, "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: 0.7.10

jobs:
  rust:
    name: Rust tests + clippy (native, wasm)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --target wasm32-unknown-unknown --no-default-features --features web -- -D warnings

  js:
    name: Sync core tests + lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Pass the file, not the directory: Node 24 treats a directory argument as a module to run
      - run: node --test tests/ktv_sync.test.cjs tests/ktv_keys.test.cjs
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno lint assets/ktv_sync.js assets/ktv_keys.js assets/mic_worklet.js tests/ktv_sync.test.cjs tests/ktv_keys.test.cjs tests/e2e/
      - run: python3 -m py_compile tools/link_check.py tools/title_aliases.py tools/harvest_library.py tools/match_mv.py
      - run: python3 -m unittest discover -s tests -p "*_test.py"

  build:
    name: Web release build
    needs: [rust, js]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: cargo-bins/cargo-binstall@422f3094be6a0843857aa008b499caaf6bce0da8 # v1.24.0
      - run: cargo binstall -y --locked dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      # Same script as deploy.sh: fails on a degraded bundle, stages dist/ with Cloudflare _headers
      - run: tools/build_web.sh
      # E2E on the exact bundle that ships, served with its real _headers (CSP) by wrangler dev
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: E2E (headless Chrome)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --yes wrangler@4.141.0 dev --port 8788 > wrangler-dev.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8788/ && break; sleep 1; done
          node --test tests/e2e/app.test.mjs || { cat wrangler-dev.log; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ktv-rs-web
          path: dist
          retention-days: 7
