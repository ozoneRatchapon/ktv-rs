name: Deploy

# Release tag (vX.Y.Z, pushed with main by the release flow) -> build + e2e -> Cloudflare -> prod e2e, rolled back to
# the previous version if prod e2e fails. Automatic (owner call 2026-09-27: no approval step). The `production`
# environment holds CLOUDFLARE_API_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (variable) and only accepts `main` and
# `v*` tags. ./deploy.sh on main stays as the manual fallback.
on:
  push:
    tags: ["v*"]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: 0.7.10
  WRANGLER: npx --yes wrangler@4.141.0
  WRANGLER_SEND_METRICS: "false"

jobs:
  build:
    name: Build + e2e the release bundle
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Gitflow: only a tag on main ships
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: cargo-bins/cargo-binstall@422f3094be6a0843857aa008b499caaf6bce0da8 # v1.24.0
      - run: cargo binstall -y --locked dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      - run: tools/build_web.sh
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: E2E (headless Chrome, real _headers)
        run: |
          $WRANGLER dev --port 8788 > wrangler-dev.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8788/ && break; sleep 1; done
          node --test tests/e2e/app.test.mjs || { cat wrangler-dev.log; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: production
      url: https://ktv-rs.solana-thailand.workers.dev/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: '[ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is not set in the production environment"; exit 1; }'
      - id: previous
        run: echo "version=$($WRANGLER deployments status --json | jq -r '.versions[0].version_id')" >> "$GITHUB_OUTPUT"
      - run: $WRANGLER deploy --tag "$GITHUB_REF_NAME" --message "$GITHUB_REF_NAME $(git rev-parse --short HEAD) (CI)"
      # Real prod state lives in Cloudflare, not git
      - run: $WRANGLER deployments list | tail -12
      - name: E2E against prod
        id: prod_e2e
        env:
          KTV_URL: https://ktv-rs.solana-thailand.workers.dev/
        run: |
          for _ in 1 2; do node --test tests/e2e/app.test.mjs && exit 0; echo "retry after cold start"; sleep 10; done
          exit 1
      # A release that breaks prod does not stay live; the failed run emails the owner
      - name: Roll back to the previous version
        if: failure() && steps.prod_e2e.outcome == 'failure' && steps.previous.outputs.version != ''
        env:
          PREVIOUS: ${{ steps.previous.outputs.version }}
        run: |
          $WRANGLER rollback "$PREVIOUS" --yes --message "auto rollback, $GITHUB_REF_NAME failed prod e2e"
