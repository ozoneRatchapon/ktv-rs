name: Deploy

# Release tag (vX.Y.Z, pushed with main by the release flow) -> build + e2e -> owner approves -> Cloudflare -> prod e2e.
# The `production` environment holds CLOUDFLARE_API_TOKEN (secret) and CLOUDFLARE_ACCOUNT_ID (variable), requires the
# owner's approval, and only accepts `main` and `v*` tags. ./deploy.sh on main stays as the manual fallback.
on:
  push:
    tags: ["v*"]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: 0.7.10
  WRANGLER: npx --yes wrangler@4.141.0
  WRANGLER_SEND_METRICS: "false"

jobs:
  build:
    name: Build + e2e the release bundle
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Gitflow: only a tag on main ships
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --locked dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      - run: tools/build_web.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: E2E (headless Chrome, real _headers)
        run: |
          $WRANGLER dev --port 8788 > wrangler-dev.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8788/ && break; sleep 1; done
          node --test tests/e2e/app.test.mjs || { cat wrangler-dev.log; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: production
      url: https://ktv-rs.solana-thailand.workers.dev/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: '[ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is not set in the production environment"; exit 1; }'
      - run: $WRANGLER deploy --tag "$GITHUB_REF_NAME" --message "$GITHUB_REF_NAME $(git rev-parse --short HEAD) (CI)"
      # Real prod state lives in Cloudflare, not git
      - run: $WRANGLER deployments list | tail -12
      - name: E2E against prod
        env:
          KTV_URL: https://ktv-rs.solana-thailand.workers.dev/
        run: |
          for _ in 1 2; do node --test tests/e2e/app.test.mjs && exit 0; echo "retry after cold start"; sleep 10; done
          exit 1
